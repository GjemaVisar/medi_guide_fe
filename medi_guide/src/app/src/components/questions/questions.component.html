<div class="questions-container">
    <div class="container-small">
      <!-- Progress Indicator -->
      <div class="progress-container mb-xl">
        <div class="progress-bar">
          <div class="progress-fill" style="width: 66%"></div>
        </div>
        <p class="progress-text">Step 2 of 3: Additional questions</p>
      </div>
  
      <div class="card" *ngIf="currentQuestion">
        <div class="card-header text-center">
          <div class="question-counter mb-md">
            <span class="current-question">{{ currentQuestionIndex + 1 }}</span>
            <span class="question-separator">of</span>
            <span class="total-questions">{{ questions.length }}</span>
          </div>
          <h2>{{ currentQuestion.text }}</h2>
        </div>
  
        <div class="card-body">
          <!-- Yes/No Question -->
          <div *ngIf="currentQuestion.type === 'yes-no'" class="question-content">
            <div class="yes-no-options">
              <button type="button" class="option-btn"
                [class.selected]="getCurrentAnswer() === true"
                (click)="answerQuestion(true)"
                [attr.aria-pressed]="getCurrentAnswer() === true">
                <div class="option-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24">
                    <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <span>Yes</span>
              </button>
              <button type="button" class="option-btn"
                [class.selected]="getCurrentAnswer() === false"
                (click)="answerQuestion(false)"
                [attr.aria-pressed]="getCurrentAnswer() === false">
                <div class="option-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24">
                    <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <span>No</span>
              </button>
            </div>
          </div>
  
          <!-- Multiple Choice -->
          <div *ngIf="currentQuestion.type === 'multiple-choice'" class="question-content">
            <div class="multiple-choice-options">
              <button type="button" class="choice-btn"
                *ngFor="let option of currentQuestion.options; trackBy: trackByOption"
                [class.selected]="getCurrentAnswer() === option"
                (click)="answerQuestion(option)"
                [attr.aria-pressed]="getCurrentAnswer() === option">
                <div class="choice-indicator">
                  <div class="choice-dot"></div>
                </div>
                <span>{{ option }}</span>
              </button>
            </div>
          </div>
  
          <!-- Scale -->
          <div *ngIf="currentQuestion.type === 'scale'" class="question-content">
            <div class="scale-container">
              <div class="scale-labels">
                <span class="scale-label">Mild</span>
                <span class="scale-label">Severe</span>
              </div>
              <div class="scale-options">
                <button type="button" class="scale-btn"
                  *ngFor="let i of getScaleNumbers(); trackBy: trackByIndex"
                  [class.selected]="getCurrentAnswer() === i"
                  (click)="answerQuestion(i)">
                  {{ i }}
                </button>
              </div>
              <p class="scale-help">Rate from 1 (mild) to 10 (severe)</p>
            </div>
          </div>
  
          <!-- Text -->
          <div *ngIf="currentQuestion.type === 'text'" class="question-content">
            <div class="form-group">
              <label [for]="'text-answer-' + currentQuestion.id" class="form-label sr-only">Your answer</label>
              <textarea
                [id]="'text-answer-' + currentQuestion.id"
                class="form-input text-answer"
                [(ngModel)]="textAnswer"
                (ngModelChange)="answerQuestion($event)"
                placeholder="Please provide additional details..."
                rows="4">
              </textarea>
            </div>
          </div>
        </div>
  
        <div class="card-footer">
          <div class="footer-actions">
            <button type="button" class="btn btn-secondary" (click)="previousQuestion()" [disabled]="currentQuestionIndex === 0">
              <svg width="16" height="16" viewBox="0 0 16 16">
                <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Previous
            </button>
  
            <div class="question-progress">
              <div class="progress-dots">
                <div class="progress-dot"
                  *ngFor="let question of questions; let i = index"
                  [class.completed]="i < currentQuestionIndex"
                  [class.current]="i === currentQuestionIndex">
                </div>
              </div>
            </div>
  
            <button type="button" class="btn btn-primary"
            (click)="nextQuestion()"
            [disabled]="!isCurrentQuestionAnswered()">
            <span *ngIf="currentQuestionIndex < questions.length - 1">Next</span>
            <span *ngIf="currentQuestionIndex === questions.length - 1">Get Results</span>
          </button>
          </div>
        </div>
      </div>
  
      <!-- Loading -->
      <div class="card text-center" *ngIf="isLoading">
        <div class="card-body">
          <div class="loading-container">
            <div class="loading-spinner"></div>
            <h3>Loading questions...</h3>
            <p>Preparing personalized questions based on your symptoms.</p>
          </div>
        </div>
      </div>
  
      <!-- Error -->
      <div class="card" *ngIf="error">
        <div class="card-body text-center">
          <div class="error-container">
            <h3>Something went wrong</h3>
            <p>{{ error }}</p>
            <button type="button" class="btn btn-primary" (click)="goBack()">Go Back</button>
          </div>
        </div>
      </div>
    </div>
  </div>
